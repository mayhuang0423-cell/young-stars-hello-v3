<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7b61d1"><title>Young Stars 1 · Hello!</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#283251;background:#f5f3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e9f5ff,#fff1f6 55%,#fff8d8);min-height:100vh}.app{max-width:650px;margin:auto;padding:18px 15px 40px}.hero{background:linear-gradient(125deg,#6d66db,#a16cd8,#ef86b0);border-radius:26px;color:white;padding:22px;box-shadow:0 12px 30px #7060c230}.hero h1{margin:0;font-size:29px}.hero p{margin:7px 0 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.stars{background:#ffffff35;border-radius:30px;padding:9px 13px;white-space:nowrap;font-weight:800}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.nav button{border:0;border-radius:15px;padding:13px 5px;background:#fff;color:#555184;font-weight:800;box-shadow:0 4px 15px #7465a317}.nav button.active{background:#7563d5;color:white}.panel{background:white;border-radius:24px;padding:20px;box-shadow:0 10px 28px #6856a61a;min-height:380px}h2{font-size:23px;margin:0 0 7px}.hint{color:#6f7894;font-size:14px;line-height:1.7}.big{font-size:38px;font-weight:850;margin:15px 0 4px}.center{text-align:center}.illustration{font-size:90px;margin:18px auto;display:flex;align-items:center;justify-content:center;background:#f1f6ff;border-radius:22px;min-height:155px}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:15px}button{cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffae45;outline-offset:3px}.primary{background:#7361d7;color:#fff;border:0;border-radius:15px;padding:14px 18px;font-size:16px;font-weight:800}.secondary{background:#edf0ff;color:#5047a0;border:0;border-radius:15px;padding:13px 16px;font-weight:800}.options{display:grid;gap:10px;margin-top:18px}.option{background:#f5f6ff;border:2px solid transparent;border-radius:15px;padding:16px;text-align:left;font-size:18px;font-weight:700;color:#29335a}.option.selected{border-color:#7563d5;background:#ece9ff}.option.correct{border-color:#29a976;background:#e4faee}.option.wrong{border-color:#e78a89;background:#fff0f0}.feedback{min-height:26px;margin-top:15px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:9px;background:#ede9ff;border-radius:10px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#7d68d9;transition:width .25s}.wordgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.word{border:2px solid #eeeaff;background:#fbfaff;border-radius:17px;padding:15px 6px;text-align:center}.word .emoji{font-size:46px;display:block;margin-bottom:6px}.word strong{display:block;font-size:17px}.word small{color:#717b96}.note{background:#fff9e7;border-radius:13px;padding:12px;color:#746035;font-size:13px;margin-top:16px;line-height:1.7}.footer{font-size:12px;color:#6f7290;text-align:center;margin:22px 0}.teacher{margin-top:12px}select{padding:10px;border-radius:12px;border:1px solid #ddd7fa;background:white;font-size:16px}#notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263052;color:white;padding:12px 20px;border-radius:16px;display:none;z-index:10;max-width:90vw;text-align:center}.muted{font-size:13px;color:#8189a0}@media(min-width:560px){.nav{grid-template-columns:repeat(6,1fr)}.wordgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><header class="hero"><div class="top"><div><h1>🌈 Young Stars 1</h1><p>Lesson 1 · Hello! 👋</p></div><div class="stars" id="starLabel">⭐ 0</div></div><p style="font-size:13px">Learn · Listen · Repeat · Play</p></header><nav class="nav" id="nav"></nav><section class="panel" id="content" aria-live="polite"></section><div class="footer">原創互動複習示範 · 非官方 Young Stars 教材<br>資料只保存在這個瀏覽器；語音效果依裝置而異。</div></main><div id="notice" role="status"></div><script>
const sections=[['cards','圖卡'],['talk','會話'],['numbers','數字'],['shapes','形狀'],['listen','聽力'],['quiz','闖關']];
const cards=[{en:'Hello!',zh:'你好！',emoji:'👋'},{en:'Goodbye!',zh:'再見！',emoji:'👋'},{en:'What’s your name?',zh:'你叫什麼名字？',emoji:'🙋'},{en:'My name is Amy.',zh:'我的名字是 Amy。',emoji:'👧'},{en:'How are you?',zh:'你好嗎？',emoji:'😊'},{en:'I’m fine, thanks.',zh:'我很好，謝謝。',emoji:'😄'}];
const numbers=[['one','1️⃣'],['two','2️⃣'],['three','3️⃣'],['four','4️⃣'],['five','5️⃣']];
const shapes=[['circle','🔴'],['square','🟦'],['triangle','🔺'],['star','⭐']];
const dialogs=[['Hello!','Hello!'],['What’s your name?','My name is Amy.'],['How are you?','I’m fine, thanks.'],['Goodbye!','Goodbye!']];
const quiz=[{q:'What do you say when you meet a friend?',options:['Hello!','Goodbye!','Five'],answer:0,say:'Hello!'},{q:'How are you?',options:['I’m fine, thanks.','My name is Amy.','Three'],answer:0,say:'How are you?'},{q:'What’s your name?',options:['I’m fine.','My name is Amy.','Goodbye!'],answer:1,say:'What’s your name?'},{q:'Which number is 3?',options:['one','three','five'],answer:1,say:'three'},{q:'Which shape has three sides?',options:['circle','square','triangle'],answer:2,say:'triangle'},{q:'Which number comes after four?',options:['three','five','two'],answer:1,say:'five'},{q:'What do you say when leaving?',options:['Goodbye!','Hello!','How are you?'],answer:0,say:'Goodbye!'},{q:'Which shape is round?',options:['square','circle','triangle'],answer:1,say:'circle'},{q:'Which number is 1?',options:['five','two','one'],answer:2,say:'one'},{q:'Which shape has four equal sides?',options:['triangle','square','circle'],answer:1,say:'square'}];
let section='cards',cardIndex=0,talkIndex=0,questionIndex=0,chosen=-1,answered=false,roundScore=0,finished=false;
const saved=JSON.parse(localStorage.getItem('ys1hello_progress')||'{}');let stars=Number(saved.stars)||0;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const n=$('notice');n.textContent=t;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.style.display='none',2300)}
function store(){localStorage.setItem('ys1hello_progress',JSON.stringify({stars}));$('starLabel').textContent='⭐ '+stars}
function audio(text){const file='audio/'+text.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.mp3';let a=new Audio(file);a.onended=()=>{};a.onerror=()=>fallback(text);a.play().catch(()=>fallback(text))}
function fallback(text){if(!('speechSynthesis' in window)){toast('此裝置不支援語音，請加入 MP3 音檔');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.07;const voices=speechSynthesis.getVoices();const us=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&/female|samantha|aria|jenny|zira/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('en-us'));if(us)u.voice=us;speechSynthesis.speak(u)}
function repeat(text){audio(text);toast('聽完後，請跟讀一次 🎤')}
function setSection(s){section=s;render()}
function renderNav(){$('nav').innerHTML=sections.map(([id,label])=>`<button class="${section===id?'active':''}" onclick="setSection('${id}')">${label}</button>`).join('')}
function render(){renderNav();let h='';if(section==='cards'){const c=cards[cardIndex];h=`<h2>🖼️ Vocabulary</h2><div class="hint">點選播放英文，聽完後跟讀。</div><div class="illustration">${c.emoji}</div><div class="center"><div class="big" style="font-size:clamp(25px,7vw,38px)">${esc(c.en)}</div><p>${esc(c.zh)}</p><div class="muted">${cardIndex+1} / ${cards.length}</div></div><div class="actions"><button class="secondary" onclick="cardIndex=(cardIndex+${cards.length}-1)%${cards.length};render()">◀ 上一張</button><button class="primary" onclick="repeat(cards[cardIndex].en)">🔊 Listen</button><button class="secondary" onclick="cardIndex=(cardIndex+1)%${cards.length};render()">下一張 ▶</button></div>`}
if(section==='talk'){const d=dialogs[talkIndex];h=`<h2>💬 Listen & Repeat</h2><p class="hint">先聽老師示範，再留 3 秒開口跟讀。</p><div class="illustration">🧒🏻 💬 👧🏻</div><div class="center"><p class="big" style="font-size:26px">${esc(d[0])}</p><p class="big" style="font-size:26px;color:#7b61d1">${esc(d[1])}</p><p class="muted">對話 ${talkIndex+1} / ${dialogs.length}</p></div><div class="actions"><button class="primary" onclick="playDialog()">🔊 播放對話</button><button class="secondary" onclick="talkIndex=(talkIndex+1)%dialogs.length;render()">下一組 ▶</button></div><div class="note">提示：點選播放後會依序播放兩句英文；句與句之間預留跟讀時間。使用高品質 MP3 時效果最好。</div>`}
if(section==='numbers'||section==='shapes'){const arr=section==='numbers'?numbers:shapes;h=`<h2>${section==='numbers'?'🔢 Numbers 1–5':'🔷 Shapes'}</h2><p class="hint">點選圖卡，聽英文發音。</p><div class="wordgrid">${arr.map(([w,e])=>`<button class="word" onclick="repeat('${w}')"><span class="emoji">${e}</span><strong>${w}</strong><small>🔊 點我聽</small></button>`).join('')}</div>`}
if(section==='listen'){h=`<h2>🎧 Listening Practice</h2><p class="hint">點「播放題目」聽英文，再選出正確答案。</p><div class="illustration">🎧 🌟</div><div class="actions"><button class="primary" onclick="audio('circle')">🔊 播放題目</button></div><div class="options" id="listenChoices">${[['🔴','circle'],['🔺','triangle'],['🟦','square']].map(([e,w])=>`<button class="option" onclick="checkListening(this,'${w}')">${e}</button>`).join('')}</div><div class="feedback" id="listenFeedback"></div>`}
if(section==='quiz'){if(finished){h=`<div class="center"><div class="illustration">🏆</div><h2>Great job!</h2><p class="big">${roundScore} / ${quiz.length}</p><p>你完成了 Hello! 闖關挑戰！</p><button class="primary" onclick="restartQuiz()">🔄 再玩一次</button></div>`}else{const q=quiz[questionIndex];h=`<div class="row"><h2>🏆 Fun Quiz</h2><b>${questionIndex+1} / ${quiz.length}</b></div><div class="progress"><div style="width:${100*(questionIndex+1)/quiz.length}%"></div></div><p class="big" style="font-size:24px">${esc(q.q)}</p><div class="actions"><button class="secondary" onclick="audio(quiz[questionIndex].say)">🔊 聽英文</button></div><div class="options">${q.options.map((o,i)=>`<button class="option ${answered?(i===q.answer?'correct':i===chosen?'wrong':''):chosen===i?'selected':''}" onclick="choose(${i})" ${answered?'disabled':''}>${esc(o)}</button>`).join('')}</div><div class="feedback">${answered?(chosen===q.answer?'🌟 Excellent! 答對了！':'💡 Good try! 正確答案：'+esc(q.options[q.answer])):''}</div><div class="actions">${answered?'<button class="primary" onclick="nextQuestion()">'+(questionIndex===quiz.length-1?'查看成績 🏆':'下一題 ▶')+'</button>':'<button class="primary" onclick="submitAnswer()" '+(chosen<0?'disabled':'')+'>確認答案</button>'}</div>`}}
$('content').innerHTML=h}
function checkListening(btn,w){document.querySelectorAll('#listenChoices button').forEach(b=>b.disabled=true);const ok=w==='circle';btn.classList.add(ok?'correct':'wrong');$('listenFeedback').textContent=ok?'🌟 Excellent! It’s a circle!':'💡 Try again! The answer is circle.';if(ok){stars++;store()}}
function choose(i){if(!answered){chosen=i;render()}}
function submitAnswer(){if(chosen<0||answered)return;answered=true;if(chosen===quiz[questionIndex].answer){roundScore++;stars++;store()}render()}
function nextQuestion(){if(questionIndex===quiz.length-1){finished=true}else{questionIndex++;chosen=-1;answered=false}render()}
function restartQuiz(){questionIndex=0;chosen=-1;answered=false;roundScore=0;finished=false;render()}
async function playDialog(){const d=dialogs[talkIndex];audio(d[0]);toast('請跟讀第一句，再聽第二句');setTimeout(()=>audio(d[1]),4800)}
store();render();
</script></body></html>
